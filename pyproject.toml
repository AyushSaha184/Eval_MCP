[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-mcp"
version = "0.1.0"
description = "Production-oriented MCP evaluation platform for prompt workflows and RAG pipelines."
readme = "README.MD"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.2",
  "aiosqlite>=0.20.0",
  "asyncpg>=0.29.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "mcp>=1.0.0",
  "prefab-ui>=0.1.0",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "redis>=5.0.8",
  "sqlalchemy>=2.0.32",
  "uvicorn>=0.30.6",
]

[project.scripts]
eval-mcp = "eval_mcp.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
]
s3 = [
  "boto3>=1.34.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "api*",
  "core*",
  "dashboard*",
  "db*",
  "domain*",
  "eval_mcp*",
  "eval_mcp_server*",
  "eval_backends*",
  "services*",
  "storage*",
  "tools*",
  "workers*",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -p no:cacheprovider"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = [
  "api",
  "core",
  "dashboard",
  "db",
  "domain",
  "eval_mcp",
  "eval_mcp_server",
  "eval_backends",
  "services",
  "storage",
  "tools",
  "workers",
]
