services:
  # Web API Server
  - type: web
    name: eval-mcp-api
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: ./eval-mcp api
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: DATA_DIR
        value: /app/data
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: eval-mcp-redis
          property: connectionString

  # Background Evaluation Worker
  - type: worker
    name: eval-mcp-worker
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: ./eval-mcp worker
    envVars:
      - key: DATA_DIR
        value: /app/data
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: eval-mcp-redis
          property: connectionString

  # Redis Queue
  - type: redis
    name: eval-mcp-redis
    ipAllowList: []
    plan: free
